name: Build Sunshine for Kepler K600 (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 拉取完整源码 + 所有子模块
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 配置 MSVC 编译环境（VS2022）
      - name: Setup MSVC build tools
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "17"

      # 3. 安装 pkg-config 依赖检测工具
      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      # 4. 安装 libtiff 开发库（修复 libtiff-4 not found 报错）
      - name: Install libtiff prebuilt libraries
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # 下载带 pkg-config 元数据的 libtiff 4.x Win64 开发包
          Invoke-WebRequest -Uri "https://github.com/oschwartz10612/WinLibs/releases/download/v12.0.0/libtiff-4.5.1-win64.zip" -OutFile "libtiff.zip"
          Expand-Archive -Path libtiff.zip -DestinationPath C:\libtiff
          # 配置 pkg-config 搜索路径，让 CMake 能找到 .pc 配置文件
          echo "PKG_CONFIG_PATH=C:\libtiff\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 运行时 DLL 加入系统 PATH
          echo "C:\libtiff\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. 安装 CUDA Toolkit 11.8（最后一个支持 Kepler sm_35 的版本）
      - name: Install CUDA Toolkit 11.8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/11.8.0/local_installers/cuda_11.8.0_522.06_windows.exe" -OutFile "cuda_installer.exe"
          Start-Process -FilePath ".\cuda_installer.exe" -ArgumentList "-s", "nvcc_11.8", "cudart_11.8" -Wait
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 6. 验证 CUDA 安装
      - name: Verify CUDA
        run: nvcc -V

      # 7. 安装 FFmpeg 开发库
      - name: Install FFmpeg SDK
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg
          echo "FFMPEG_DIR=C:\ffmpeg\ffmpeg-master-latest-win64-gpl-shared" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 8. CMake 配置（核心：启用 CUDA + 指定 sm_35 架构）
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSUNSHINE_ENABLE_CUDA=ON `
            -DCUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v11.8" `
            -DCMAKE_CUDA_ARCHITECTURES=35 `
            .

      # 9. 执行编译
      - name: Build Sunshine
        run: cmake --build build --config Release

      # 10. 上传编译产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-k600-nvenc
          path: build/Release/
