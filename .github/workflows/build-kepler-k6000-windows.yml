name: Build Sunshine for Kepler K600 (Windows - vcpkg)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 拉取完整源码 + 所有递归子模块
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 配置 MSVC 编译环境（VS2022）
      - name: Setup MSVC build tools
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "17"

      # 3. 安装 vcpkg 并部署 libtiff 依赖
      - name: Setup vcpkg and install libtiff
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # 克隆 vcpkg 官方仓库（浅克隆加速）
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg --depth 1
          # 初始化 vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          # 安装 64 位 Release 版 libtiff（自动包含 pkg-config 元数据）
          C:\vcpkg\vcpkg install tiff:x64-windows-release
          # 配置 CMake 工具链文件，让构建系统自动找到 vcpkg 安装的库
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 配置 vcpkg 默认编译目标
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 4. 安装 CUDA Toolkit 11.8（最后一个支持 Kepler sm_35 的版本）
      - name: Install CUDA Toolkit 11.8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/11.8.0/local_installers/cuda_11.8.0_522.06_windows.exe" -OutFile "cuda_installer.exe"
          Start-Process -FilePath ".\cuda_installer.exe" -ArgumentList "-s", "nvcc_11.8", "cudart_11.8" -Wait
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. 验证 CUDA 安装
      - name: Verify CUDA
        run: nvcc -V

      # 6. 安装 FFmpeg 开发库（音视频核心依赖）
      - name: Install FFmpeg SDK
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg
          echo "FFMPEG_DIR=C:\ffmpeg\ffmpeg-master-latest-win64-gpl-shared" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 7. CMake 构建配置（核心参数）
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSUNSHINE_ENABLE_CUDA=ON `
            -DCUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v11.8" `
            -DCMAKE_CUDA_ARCHITECTURES=35 `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" `
            .

      # 8. 执行编译
      - name: Build Sunshine
        run: cmake --build build --config Release

      # 9. 上传编译产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-k600-nvenc
          path: build/Release/
