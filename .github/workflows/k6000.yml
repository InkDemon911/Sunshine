name: Build Sunshine for Quadro K6000 (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 拉取完整源码 + 所有递归子模块
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 配置 MSVC 编译环境（VS2022）
      - name: Setup MSVC build tools
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "17"

      # 3. 安装 pkg-config 工具
      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      # 4. 用 vcpkg 安装 libtiff（仅装库，不注入工具链）
      - name: Install libtiff via vcpkg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg --depth 1 --branch 2024.02.14
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg install tiff:x64-windows-release
          # 只把 pkg-config 路径加入环境，让 CMake 通过 pkg-config 找到 tiff
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows-release\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\vcpkg\installed\x64-windows-release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. 安装 CUDA Toolkit 11.8（最后支持 Kepler sm_35 架构）
      - name: Install CUDA Toolkit 11.8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/11.8.0/local_installers/cuda_11.8.0_522.06_windows.exe" -OutFile "cuda_installer.exe"
          Start-Process -FilePath ".\cuda_installer.exe" -ArgumentList "-s", "nvcc_11.8", "cudart_11.8" -Wait
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 6. 验证 CUDA 安装
      - name: Verify CUDA
        run: nvcc -V

      # 7. 安装 FFmpeg 开发库
      - name: Install FFmpeg SDK
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg
          echo "FFMPEG_DIR=C:\ffmpeg\ffmpeg-master-latest-win64-gpl-shared" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 8. CMake 配置（移除 vcpkg 工具链，避免递归）
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSUNSHINE_ENABLE_CUDA=ON `
            -DCUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v11.8" `
            -DCMAKE_CUDA_ARCHITECTURES=35 `
            .

      # 9. 执行编译
      - name: Build Sunshine
        run: cmake --build build --config Release

      # 10. 上传编译产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-quadro-k6000-nvenc
          path: build/Release/
