name: Build Sunshine for K6000 (NVENC H.264)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Sunshine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            cmake
            ninja
            pkgconf
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-miniupnpc

      - name: Build nv-codec-headers (n11.1.5.0)
        run: |
          cd /tmp
          git clone https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers
          git checkout n11.1.5.0
          make install PREFIX=$MINGW_PREFIX
          # 重写 .pc，保证 Libs 非空
          printf '%s\n' \
            "prefix=$MINGW_PREFIX" \
            "includedir=\${prefix}/include" \
            "" \
            "Name: ffnvcodec" \
            "Description: FFmpeg version of Nvidia Codec SDK headers" \
            "Version: 11.1.5.0" \
            "Cflags: -I\${includedir}" \
            "Libs: -L\${prefix}/lib" \
            > $MINGW_PREFIX/lib/pkgconfig/ffnvcodec.pc
          echo "=== ffnvcodec.pc content ==="
          cat $MINGW_PREFIX/lib/pkgconfig/ffnvcodec.pc
          export PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$MINGW_PREFIX/lib/pkgconfig
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
          echo "=== pkg-config exit codes ==="
          pkg-config --cflags ffnvcodec; echo "cflags exit: $?"
          pkg-config --libs   ffnvcodec; echo "libs   exit: $?"

      - name: Build FFmpeg 6.1.1 with NVENC
        run: |
          cd /tmp
          git clone https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          git checkout n6.1.1
          # 创建假的 libnvEncodeAPI.a，同时定义大小写两种符号
          mkdir -p /tmp/fakenv
          cat > /tmp/fakenv/nv.c <<'EOF'
          typedef int NVENCSTATUS;
          typedef struct _NV_ENCODE_API_FUNCTION_LIST NV_ENCODE_API_FUNCTION_LIST;
          NVENCSTATUS NvEncodeAPICreateInstance(NV_ENCODE_API_FUNCTION_LIST *p) { return 0; }
          NVENCSTATUS nvEncodeAPICreateInstance(NV_ENCODE_API_FUNCTION_LIST *p) { return 0; }
          EOF
          gcc -c /tmp/fakenv/nv.c -o /tmp/fakenv/nv.o
          ar rcs $MINGW_PREFIX/lib/libnvEncodeAPI.a /tmp/fakenv/nv.o
          # pkg-config wrapper：给 ffnvcodec 返回 MSYS2 风格路径
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/pkg-config <<'WRAPPER'
          #!/bin/bash
          REAL_PKG_CONFIG=/mingw64/bin/pkg-config
          for arg in "$@"; do
              if [[ "$arg" == *ffnvcodec* ]]; then
                  case "$1" in
                      --exists)        exit 0 ;;
                      --modversion)    echo "11.1.5.0"; exit 0 ;;
                      --cflags)        echo "-I/mingw64/include"; exit 0 ;;
                      --cflags-only-I) echo "-I/mingw64/include"; exit 0 ;;
                      --libs)          echo "-L/mingw64/lib -lnvEncodeAPI"; exit 0 ;;
                      --libs-only-l)   echo "-lnvEncodeAPI"; exit 0 ;;
                      --libs-only-L)   echo "-L/mingw64/lib"; exit 0 ;;
                  esac
              fi
          done
          exec "$REAL_PKG_CONFIG" "$@"
          WRAPPER
          chmod +x /tmp/fakebin/pkg-config
          export PATH="/tmp/fakebin:$PATH"
          echo "=== pkg-config ffnvcodec ==="
          pkg-config --exists ffnvcodec && echo "ffnvcodec found" || echo "ffnvcodec NOT found"
          pkg-config --cflags ffnvcodec
          pkg-config --libs ffnvcodec

          ./configure \
            --prefix=$MINGW_PREFIX \
            --enable-shared --disable-static \
            --enable-gpl --enable-nonfree \
            --enable-nvenc \
            --enable-w32threads \
            --disable-doc \
            --disable-cuda \
            --disable-hwcontext_cuda

          CONFIGURE_RET=$?
          if [ $CONFIGURE_RET -ne 0 ]; then
            echo "=== configure failed, config.log tail ==="
            grep -n -A 30 "check_pkg_config ffnvcodec\|check_func_headers" ffbuild/config.log | tail -n 200
            exit $CONFIGURE_RET
          fi

          make -j$(nproc)
          make install

      - name: Copy config.log to workspace
        if: failure()
        shell: msys2 {0}
        run: |
          cp /tmp/ffmpeg/ffbuild/config.log "$GITHUB_WORKSPACE/config.log" || true

      - name: Upload FFmpeg config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: config.log

      - name: Build Sunshine
        run: |
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DCMAKE_PREFIX_PATH=/mingw64
          cmake --build build -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/sunshine.exe dist/
          cp /mingw64/bin/*.dll dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-k6000
          path: dist/
