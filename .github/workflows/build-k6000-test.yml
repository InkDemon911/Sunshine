name: Build Sunshine for K6000 (NVENC H.264) Changed
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Sunshine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies Windows
        # if a dependency needs to be pinned, see https://github.com/LizardByte/build-deps/pull/186
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            git
            make
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt6-static
            
      - name: Update Windows dependencies
        env:
          # MSYSTEM is a built-in environment variable of MSYS2.
          # Do not use this environment variable name.
          MATRIX_MSYSTEM: ucrt64
          TOOLCHAIN: ucrt-x86_64
        shell: msys2 {0}
        run: |
          # variables
          declare -A pinned_deps

          # dependencies
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-boost"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-doxygen"
            "mingw-w64-${TOOLCHAIN}-gcc"
            "mingw-w64-${TOOLCHAIN}-graphviz"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
            "mingw-w64-${TOOLCHAIN}-qt6-static"
          )

          if [[ "${MATRIX_MSYSTEM}" == "ucrt64" ]]; then
            dependencies+=(
              "mingw-w64-${TOOLCHAIN}-MinHook"
              "mingw-w64-${TOOLCHAIN}-nsis"
            )
          fi

          # do not modify below this line

          ignore_packages=()
          tarballs=""
          for pkg in "${!pinned_deps[@]}"; do
            ignore_packages+=("${pkg}")
            version="${pinned_deps[$pkg]}"
            tarball="${pkg}-${version}-any.pkg.tar.zst"

            # download working version
            wget --max-redirect=0 "https://repo.msys2.org/mingw/${MATRIX_MSYSTEM}/${tarball}"

            tarballs="${tarballs} ${tarball}"
          done

          # Create the ignore string for pacman
          ignore_list=$(IFS=,; echo "${ignore_packages[*]}")

          # install pinned dependencies
          if [ -n "${tarballs}" ]; then
            pacman -U --noconfirm "${tarballs}"
          fi

          # Only add --ignore if we have packages to ignore
          if [ -n "${ignore_list}" ]; then
            pacman -Syu --noconfirm --ignore="${ignore_list}" "${dependencies[@]}"
          else
            pacman -Syu --noconfirm "${dependencies[@]}"
          fi


      - name: Build nv-codec-headers (n11.1.5.0)
        run: |
          cd /tmp
          git clone https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers
          git checkout n11.1.5.0
          make install PREFIX=$MINGW_PREFIX
          # 重写 .pc，保证 Libs 非空
          printf '%s\n' \
            "prefix=$MINGW_PREFIX" \
            "includedir=\${prefix}/include" \
            "" \
            "Name: ffnvcodec" \
            "Description: FFmpeg version of Nvidia Codec SDK headers" \
            "Version: 11.1.5.0" \
            "Cflags: -I\${includedir}" \
            "Libs: -L\${prefix}/lib" \
            > $MINGW_PREFIX/lib/pkgconfig/ffnvcodec.pc
          echo "=== ffnvcodec.pc content ==="
          cat $MINGW_PREFIX/lib/pkgconfig/ffnvcodec.pc
          export PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$MINGW_PREFIX/lib/pkgconfig
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
          echo "=== pkg-config exit codes ==="
          pkg-config --cflags ffnvcodec; echo "cflags exit: $?"
          pkg-config --libs   ffnvcodec; echo "libs   exit: $?"

      - name: Build FFmpeg 6.1.1 with NVENC
        run: |
          cd /tmp
          git clone https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          git checkout n6.1.1

          # 创建假的 libnvEncodeAPI.a，同时定义大小写两种符号
          mkdir -p /tmp/fakenv
          cat > /tmp/fakenv/nv.c <<'EOF'
          typedef int NVENCSTATUS;
          typedef struct _NV_ENCODE_API_FUNCTION_LIST NV_ENCODE_API_FUNCTION_LIST;
          NVENCSTATUS NvEncodeAPICreateInstance(NV_ENCODE_API_FUNCTION_LIST *p) { return 0; }
          NVENCSTATUS nvEncodeAPICreateInstance(NV_ENCODE_API_FUNCTION_LIST *p) { return 0; }
          EOF
          gcc -c /tmp/fakenv/nv.c -o /tmp/fakenv/nv.o
          ar rcs $MINGW_PREFIX/lib/libnvEncodeAPI.a /tmp/fakenv/nv.o

          # pkg-config wrapper：给 ffnvcodec 返回 MSYS2 风格路径
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/pkg-config <<'WRAPPER'
          #!/bin/bash
          REAL_PKG_CONFIG=/mingw64/bin/pkg-config
          for arg in "$@"; do
              if [[ "$arg" == *ffnvcodec* ]]; then
                  case "$1" in
                      --exists)        exit 0 ;;
                      --modversion)    echo "11.1.5.0"; exit 0 ;;
                      --cflags)        echo "-I/mingw64/include"; exit 0 ;;
                      --cflags-only-I) echo "-I/mingw64/include"; exit 0 ;;
                      --libs)          echo "-L/mingw64/lib -lnvEncodeAPI"; exit 0 ;;
                      --libs-only-l)   echo "-lnvEncodeAPI"; exit 0 ;;
                      --libs-only-L)   echo "-L/mingw64/lib"; exit 0 ;;
                  esac
              fi
          done
          exec "$REAL_PKG_CONFIG" "$@"
          WRAPPER
          chmod +x /tmp/fakebin/pkg-config
          export PATH="/tmp/fakebin:$PATH"

          echo "=== pkg-config ffnvcodec ==="
          pkg-config --exists ffnvcodec && echo "ffnvcodec found" || echo "ffnvcodec NOT found"
          pkg-config --cflags ffnvcodec
          pkg-config --libs ffnvcodec

          ./configure \
            --prefix=$MINGW_PREFIX \
            --enable-shared --disable-static \
            --enable-gpl --enable-nonfree \
            --enable-nvenc \
            --enable-w32threads \
            --disable-doc \
            --disable-cuda \
            --disable-cuvid \
            --disable-nvdec \
            --disable-vulkan

          CONFIGURE_RET=$?
          if [ $CONFIGURE_RET -ne 0 ]; then
            echo "=== configure failed, config.log tail ==="
            grep -n -A 30 "check_pkg_config ffnvcodec\|check_func_headers" ffbuild/config.log | tail -n 200
            exit $CONFIGURE_RET
          fi

          # 强制关闭 CUDA，避免 hwcontext_cuda 链接错误
          if grep -q '^#define CONFIG_CUDA 1' config.h; then
            sed -i 's/^#define CONFIG_CUDA 1/#define CONFIG_CUDA 0/' config.h
          fi
          if grep -q '^CONFIG_CUDA=yes' ffbuild/config.mak; then
            sed -i 's/^CONFIG_CUDA=yes/CONFIG_CUDA=no/' ffbuild/config.mak
          fi

          # 保险：从 Makefile 中移除 hwcontext_cuda.o
          sed -i '/hwcontext_cuda\.o/d' libavutil/Makefile

          make -j$(nproc)
          make install

      - name: Copy config.log to workspace
        if: failure()
        shell: msys2 {0}
        run: |
          cp /tmp/ffmpeg/ffbuild/config.log "$GITHUB_WORKSPACE/config.log" || true

      - name: Upload FFmpeg config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: config.log

      - name: Build Sunshine
        run: |
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DFFMPEG_PREPARED_BINARIES=/mingw64 \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCPM_nv_codec_headers_13_1_SOURCE=/tmp/nv-codec-headers \
            -DGLAD_SKIP_PIP_INSTALL=ON
          cmake --build build -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/sunshine.exe dist/
          cp /mingw64/bin/*.dll dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-k6000
          path: dist/
